[package]
name = "bastion-hud"
version = "0.1.1"
description = "A sci-fi terminal and system monitor for Bastion"
edition = "2021"

[lib]
name = "bastion_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# Pinned: sysinfo changes its API between 0.x releases.
sysinfo = "0.33"
