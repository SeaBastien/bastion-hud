name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  linux-rpm:
    name: Build Linux RPM
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript packages
        run: npm install

      - name: Build the RPM
        run: npm run tauri build -- --bundles rpm

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rpm=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -n 1)
          test -n "$rpm"
          cp "$rpm" bastion-hud.x86_64.rpm
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Rebuilt automatically on every push to main."
          gh release upload latest bastion-hud.x86_64.rpm --clobber
